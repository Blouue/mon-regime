# Publie le dossier app/ sur GitHub Pages à chaque push sur main (aucune étape de build).
# Deux jobs, comme le modèle officiel de GitHub : l'envoi du paquet (build) puis la publication (deploy).
# En un seul job, la publication ne retrouvait parfois pas le paquet tout juste envoyé.
name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
